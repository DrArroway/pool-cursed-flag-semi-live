<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Cursed Flag (Semi-Live)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        /* Force Safari on macOS to display numeric stepper arrows */
        #archiveIndexInput::-webkit-outer-spin-button,
        #archiveIndexInput::-webkit-inner-spin-button {
            -webkit-appearance: inner-spin-button !important;
            appearance: inner-spin-button !important;
            opacity: 1 !important;
            display: block !important;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card bg-dark border-secondary text-white mb-4">
                    <div class="card-body text-center">
                        <h1 class="card-title h3">Pool Cursed Flag Tracker</h1>
                        <p class="text-muted small mb-0">Adjusting the flag dynamically based on swamp water status</p>
                    </div>
                </div>

                <div class="position-relative mb-4 text-center">
                    <div class="border border-secondary rounded p-2 bg-black">
                        <canvas id="flagCanvas" width="600" height="400" class="img-fluid rounded"></canvas>
                    </div>
                    <div id="status" class="text-muted small mt-2" style="font-family: monospace;">Initializing matrix pipeline...</div>
                </div>

                <div class="card bg-dark border-secondary mb-4">
                    <div class="card-body">

                        <div class="mb-3">
                            <label for="sourceSelector" class="form-label" style="color: #58a6ff !important;">View Source</label>
                            <select id="sourceSelector" class="form-select bg-dark text-white border-secondary">
                                <option value="proxy-latest">🟢 Latest Local Capture</option>
                                <option value="archive-browse">📅 Historical Archive Mode</option>
                            </select>
                            <div class="mt-2">
                                <span id="valSource" class="badge bg-success">🟢 Latest Local Capture</span>
                            </div>
                        </div>

                        <div id="archivePickerContainer" class="mb-3" style="display: none;">
                            <label for="archiveDateSelect" style="color: #58a6ff !important;">Select Available Capture Date</label>
                            <select id="archiveDateSelect" class="form-select mb-2 bg-dark text-white border-secondary"></select>

                            <label for="archiveIndexInput" style="color: #58a6ff !important;">Image Sequence Index</label>
                            <div class="input-group input-group-sm mb-2">
                                <input type="number" id="archiveIndexInput" class="form-control" value="1" min="1" max="1" style="max-width: 90px;">
                                <span class="input-group-text bg-dark border-secondary text-muted" id="maxAvailableLabel">of 1 available</span>
                            </div>

                            <div id="archiveMetaDetails" class="alert alert-dark py-2 px-3 small mt-2 mb-0 border-secondary text-info" style="display: none; font-family: monospace; background-color: #0d1117;">
                                ⏰ Capture Time: Processing timestamp...
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="matrix-tracker.js" defer></script>
</body>
</html>
